name: qanda-static

# This repository holds the generator only. The database dump, the captured images
# and the generated site are content: they live on the build server, not in git.
#
#   ./build.sh <dump.sql.gz> [tag]   -> generate site/ and package a servable image
#   docker compose up -d web         -> preview a locally generated site/ on :8088
#   docker compose --profile tunnel up -d  -> preview + Cloudflare Tunnel
#
# The build profile spins up a throwaway MariaDB, loads the dump, captures images
# into ./assets and renders ./site. The tunnel profile needs CLOUDFLARE_TUNNEL_TOKEN
# in .env (copy .env.example).

services:
  web:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Cloudflare Tunnel connector. Publishes `web` at the public hostname you configure
  # in the Cloudflare Zero Trust dashboard (point that hostname's service at
  # http://web:80). Token-based, so no credentials files live in the repo.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Set in .env (copy .env.example). If blank, cloudflared exits with an auth error.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

  db:
    # Override on hosts too old for the current image: MariaDB 11 needs a newer
    # kernel than Debian 9's 4.9 and dies with "Can't initialize timers" there.
    # The build server sets QANDA_DB_IMAGE=mariadb:10.5 in its .env.
    image: ${QANDA_DB_IMAGE:-mariadb:11}
    profiles: ["build"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: qanda
    volumes:
      # The dump is private and lives on the build server, never in this repo.
      # Set QANDA_DUMP to its absolute path (build.sh does this for you).
      - ${QANDA_DUMP:-./dump.sql.gz}:/docker-entrypoint-initdb.d/qanda.sql.gz:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-proot", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Capture images into ./assets (blob avatars from the DB, Gravatars by email hash,
  # embedded content images mirrored locally). Needs network for gravatar/content.
  # Run before `generate` on a fresh dump: it is idempotent, so re-runs are cheap.
  extract:
    build:
      context: .
      dockerfile: build/Dockerfile
    profiles: ["build"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      QA_DB_HOST: db
      QA_DB_PORT: "3306"
      QA_DB_USER: root
      QA_DB_PASSWORD: root
      QA_DB_NAME: qanda
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./assets:/app/assets
    command: ["python", "extract_media.py"]

  generate:
    build:
      context: .
      dockerfile: build/Dockerfile
    profiles: ["build"]
    depends_on:
      db:
        condition: service_healthy
      extract:
        condition: service_completed_successfully
    environment:
      QA_DB_HOST: db
      QA_DB_PORT: "3306"
      QA_DB_USER: root
      QA_DB_PASSWORD: root
      QA_DB_NAME: qanda
      QA_ARCHIVED: "August 2026"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./site:/out
      - ./assets:/app/assets
