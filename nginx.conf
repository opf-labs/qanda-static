server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # --- static assets ---
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- legacy Question2Answer URLs -> static copy ---

    # /<id> (no slug) -> canonical trailing-slash form, so relative links resolve
    rewrite "^/(\d+)$" /$1/ permanent;

    # /<id>/ and /<id>/<any-old-slug> -> the question page (slug-independent)
    location ~ "^/(\d+)(/.*)?$" {
        try_files /$1/index.html =404;
    }

    # /tag/<tag> -> the tag page
    location ~ "^/tag/(.+?)/?$" {
        try_files /tags/$1.html =404;
    }

    # Q2A question-list aliases -> home
    location = /questions { return 301 /; }

    # /user/<handle> is served directly from /user/<handle>/index.html by try_files
    location / {
        try_files $uri $uri/ =404;
    }
}
